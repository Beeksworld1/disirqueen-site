<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080c">
  <meta name="robots" content="noindex, nofollow">
  <title>Coming Soon · The Bones of the Disir Queen®</title>
  <style>
    :root { color-scheme: dark; --gold: #e6b95d; --pale-gold: #f5df9a; --ink: #05080c; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--ink); color: #f7f2e7; font-family: Georgia, "Times New Roman", serif; }
    .coming-soon { position: relative; min-height: 100svh; display: grid; align-items: end; justify-items: end; overflow: hidden; isolation: isolate; padding: 2rem; }
    .coming-soon::before { content: ""; position: absolute; inset: 0; z-index: -2; background: url("assets/queen-guardian-hero.webp") center / contain no-repeat; filter: brightness(1.22); }
    .coming-soon::after { content: ""; position: absolute; inset: 0; z-index: -3; background: url("assets/queen-guardian-hero.webp") center / cover no-repeat; filter: brightness(1.22) blur(16px); transform: scale(1.04); }
    .veil { position: absolute; inset: 0; z-index: -1; box-shadow: none; pointer-events: none; }
    .panel { width: min(390px, 100%); text-align: center; padding: 1.25rem; background: linear-gradient(180deg, rgba(4,9,12,.56), rgba(3,7,10,.78)); border: 1px solid rgba(230,185,93,.48); box-shadow: 0 .6rem 1.5rem rgba(0,0,0,.25); backdrop-filter: blur(5px); }
    .brand { display: block; width: min(200px, 65%); max-height: 125px; object-fit: contain; margin: 0 auto .65rem; filter: drop-shadow(0 .55rem .8rem rgba(0,0,0,.8)); }
    .eyebrow { margin: 0 0 .8rem; color: var(--pale-gold); font: 700 clamp(.72rem,1.5vw,.92rem)/1.2 Arial, Helvetica, sans-serif; letter-spacing: .3em; text-transform: uppercase; }
    h1 { margin: 0; color: #fff9e8; font-size: clamp(2.15rem,3vw,2.65rem); font-weight: 500; letter-spacing: .04em; line-height: .94; text-shadow: 0 .2rem 1rem rgba(0,0,0,.95); }
    .divider { display: flex; align-items: center; gap: .9rem; width: min(390px,80%); margin: .7rem auto; color: var(--gold); }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, currentColor); }
    .divider::after { transform: scaleX(-1); }
    .message { max-width: 34rem; margin: 0 auto; color: #eee7da; font-size: 1rem; line-height: 1.45; }
    .tagline { margin: .8rem 0 0; color: var(--pale-gold); font: 700  .72rem/1.4 Arial, Helvetica, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    @media (max-width: 640px) {
      .coming-soon { align-items: end; padding: 1rem; }
      .coming-soon::before { background-position: center top; background-size: contain; background-repeat: no-repeat; }
      .panel { margin-top: 62svh; padding: 1rem; backdrop-filter: blur(3px); }
      .brand { width: min(170px,65%); max-height: 105px; margin-bottom: .8rem; }
      .divider { margin: .65rem auto; }
    }
    .tale-button { display: block; width: 100%; margin: 1rem 0 0; padding: .8rem 1rem; border: 1px solid var(--gold); border-radius: .2rem; background: #e6b95d; color: #101316; font: 700 .95rem/1.3 Georgia, serif; cursor: pointer; }
    a.tale-button { text-decoration: none; }
    .tale-button:hover { background: var(--pale-gold); }
    .tale-button:focus-visible { outline: 3px solid #fff9e8; outline-offset: 3px; }
    .tale-player { margin-top: 1rem; }
    .tale-player[hidden] { display: none; }
    .tale-still { display: block; width: 100%; height: auto; border: 1px solid rgba(230,185,93,.48); }
    .tale-player audio { display: block; width: 100%; margin-top: .7rem; }
    .tale-status { margin: .5rem 0 0; font: .85rem/1.4 Arial, sans-serif; }
  </style>
</head>
<body>
  <main class="coming-soon">
    <div class="veil" aria-hidden="true"></div>
    <section class="panel" aria-labelledby="page-title">
      <img class="brand" src="assets/brand-logo-gold.webp" alt="SU8 Diversified · Bones of the Disir Queen">
      <p class="eyebrow">Queen of Fate</p>
      <h1 id="page-title">Coming Soon</h1>
      <div class="divider" aria-hidden="true">◆</div>
      <p class="message">The Queen is gathering the runes. A new experience is taking shape beyond the veil.</p>
      <p class="tagline">No champion holds fortune forever.</p>
      <button class="tale-button" id="tale-button" type="button" aria-expanded="false" aria-controls="tale-player">Listen to the Queen's Tale</button>
      <a class="tale-button" href="https://www.su8diversified.com/" aria-label="Click here for more details about the Queen, the game, and who we are">Click here</a>
      <div class="tale-player" id="tale-player" hidden>
        <img class="tale-still" src="queens-tale-opening.webp" alt="Opening scene of the Queen's Tale" loading="lazy">
        <audio id="tale-audio" controls preload="none" aria-label="The Queen's Tale" src="queens-tale.mp3"></audio>
        <p class="tale-status" id="tale-status" role="status"></p>
      </div>
    </section>
  </main>
  <script>
    const taleButton = document.getElementById('tale-button');
    const talePlayer = document.getElementById('tale-player');
    const taleAudio = document.getElementById('tale-audio');
    const taleStatus = document.getElementById('tale-status');
    taleButton.addEventListener('click', () => {
      talePlayer.hidden = false;
      taleButton.setAttribute('aria-expanded', 'true');
      if (taleAudio.paused) {
        taleAudio.play().catch(() => { taleStatus.textContent = 'Press play below to listen to the Queen’s Tale.'; });
      } else { taleAudio.pause(); }
    });
    taleAudio.addEventListener('play', () => { taleButton.textContent = 'Pause the Queen’s Tale'; taleStatus.textContent = ''; });
    taleAudio.addEventListener('pause', () => { taleButton.textContent = "Listen to the Queen's Tale"; });
    taleAudio.addEventListener('ended', () => { taleButton.textContent = "Listen to the Queen's Tale"; });
    taleAudio.addEventListener('error', () => { taleStatus.textContent = 'The audio could not load. Please try again.'; });
  </script>
</body>
</html>
