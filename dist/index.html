<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080c">
  <meta name="robots" content="noindex, nofollow">
  <title>Coming Soon · The Bones of the Disir Queen®</title>
  <style>
    :root { color-scheme: dark; --gold: #e6b95d; --pale-gold: #f5df9a; --ink: #05080c; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--ink); color: #f7f2e7; font-family: Georgia, "Times New Roman", serif; }
    .coming-soon { position: relative; min-height: 100svh; display: grid; place-items: center; overflow: hidden; isolation: isolate; padding: 2rem; }
    .coming-soon::before { content: ""; position: absolute; inset: 0; z-index: -3; background: url("assets/queen-guardian-hero.webp") center 38% / cover no-repeat; }
    .coming-soon::after { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 42%, rgba(1,10,12,.18), rgba(2,5,8,.72) 66%), linear-gradient(180deg, rgba(1,4,7,.38), rgba(1,4,7,.78)); }
    .veil { position: absolute; inset: 0; z-index: -1; box-shadow: inset 0 0 9rem rgba(0,0,0,.9); pointer-events: none; }
    .panel { width: min(760px, 100%); text-align: center; padding: clamp(1.6rem, 4vw, 3.25rem); background: linear-gradient(180deg, rgba(4,9,12,.56), rgba(3,7,10,.78)); border: 1px solid rgba(230,185,93,.48); box-shadow: 0 1.5rem 5rem rgba(0,0,0,.58); backdrop-filter: blur(5px); }
    .brand { display: block; width: min(420px, 86%); max-height: 280px; object-fit: contain; margin: 0 auto 1.4rem; filter: drop-shadow(0 .55rem .8rem rgba(0,0,0,.8)); }
    .eyebrow { margin: 0 0 .8rem; color: var(--pale-gold); font: 700 clamp(.72rem,1.5vw,.92rem)/1.2 Arial, Helvetica, sans-serif; letter-spacing: .3em; text-transform: uppercase; }
    h1 { margin: 0; color: #fff9e8; font-size: clamp(2.15rem,7vw,5.4rem); font-weight: 500; letter-spacing: .04em; line-height: .94; text-shadow: 0 .2rem 1rem rgba(0,0,0,.95); }
    .divider { display: flex; align-items: center; gap: .9rem; width: min(390px,80%); margin: 1.45rem auto; color: var(--gold); }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, currentColor); }
    .divider::after { transform: scaleX(-1); }
    .message { max-width: 34rem; margin: 0 auto; color: #eee7da; font-size: clamp(1rem,2vw,1.25rem); line-height: 1.65; }
    .tagline { margin: 1.35rem 0 0; color: var(--pale-gold); font: 700 clamp(.78rem,1.7vw,1rem)/1.4 Arial, Helvetica, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    @media (max-width: 640px) {
      .coming-soon { align-items: end; padding: 1rem; }
      .coming-soon::before { background-position: 50% 20%; background-size: auto 72%; background-repeat: no-repeat; }
      .panel { margin-top: 56vh; padding: 1.35rem 1rem 1.6rem; backdrop-filter: blur(3px); }
      .brand { width: min(290px,88%); max-height: 175px; margin-bottom: .8rem; }
      .divider { margin: 1rem auto; }
    }
  </style>
</head>
<body>
  <main class="coming-soon">
    <div class="veil" aria-hidden="true"></div>
    <section class="panel" aria-labelledby="page-title">
      <img class="brand" src="assets/brand-logo-gold.webp" alt="SU8 Diversified · Bones of the Disir Queen">
      <p class="eyebrow">Queen of Fate</p>
      <h1 id="page-title">Coming Soon</h1>
      <div class="divider" aria-hidden="true">◆</div>
      <p class="message">The Queen is gathering the runes. A new experience is taking shape beyond the veil.</p>
      <p class="tagline">No champion holds fortune forever.</p>
    </section>
  </main>
</body>
</html>
